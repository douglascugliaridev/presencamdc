services:
  db:
    image: postgis/postgis:16-3.4
    container_name: presencamdc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: presencamdc
    ports:
      - '5432:5432'
    volumes:
      - presencamdc_pgdata:/var/lib/postgresql/data

volumes:
  presencamdc_pgdata: